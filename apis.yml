name: AMCC (Applied Micro Circuits Corporation)
description: >-
  Applied Micro Circuits Corporation (AMCC) was a California-based semiconductor
  company founded in 1979, originally producing application-specific integrated
  circuits (ASICs) for the military market before diversifying into commercial
  mixed-signal, networking, storage, and embedded processor products. AMCC went
  public on NASDAQ in 1997, acquired MMC Networks in 2000, and bought IBM's
  PowerPC 400 processor line in 2004. Under the AppliedMicro brand it later
  developed the X-Gene ARM 64-bit server-on-chip family. AMCC ceased to exist as
  an independent entity when MACOM completed its acquisition on January 26, 2017;
  the X-Gene compute business was subsequently spun out to form Ampere Computing.
  As a fabless silicon/hardware company (now defunct), AMCC published no public
  developer API surface, so this profile carries company identity only and no API
  artifacts.
